line-length = 120
target-version = "py312"
extend-exclude = ["apps/*/migrations"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[lint.per-file-ignores]
"config/test_settings.py" = ["F405"]

[lint.isort]
known-first-party = ["apps", "config", "conftest"]
known-third-party = ["bayesian_credit"]
