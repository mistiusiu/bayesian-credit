[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bayesian-credit"
version = "0.1.0"
description = "Hierarchical Bayesian sequential decision-making for credit risk: Two-Stage Beta-Beta, MCTM, contextual Thompson Sampling, shadow lending engine, PSI Sentinel"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Misati Randy Nyambane" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=16",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]

# Development dependencies live in the workspace (../pyproject.toml, `poetry install`).
[tool.poetry]
packages = [{ include = "bayesian_credit" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
