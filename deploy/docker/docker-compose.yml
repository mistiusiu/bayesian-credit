# docker compose -f deploy/docker/docker-compose.yml up --build
# API:          http://localhost:8000/api/docs/
# Console:      http://localhost:8080
# Temporal UI:  http://localhost:8233   (every ingest / fit / portfolio / simulation is a workflow)
# More workers: docker compose -f deploy/docker/docker-compose.yml up --scale worker=2
#
# Local development (API + worker from the Poetry venv, infrastructure in containers): `make infra`
# starts only postgres + Temporal (5432 / 7233 / 8233 on localhost).
#
# One PostgreSQL instance holds the API database (bc) and Temporal's persistence (temporal) and
# visibility (temporal_visibility) databases; see deploy/k8s/config/.
name: bayesian-credit

x-app-env: &app-env
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOW_ALL_ORIGINS: "1"
  DATABASE_URL: postgres://bc:${BC_DB_PASSWORD:-bc}@postgres:5432/bc
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: bayesian-credit-jobs
  TEMPORAL_UI_URL: http://localhost:8233

x-temporal-db: &temporal-db
  DB: postgres12
  DB_PORT: "5432"
  POSTGRES_SEEDS: postgres
  POSTGRES_USER: temporal
  POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
  DBNAME: temporal
  VISIBILITY_DBNAME: temporal_visibility

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BC_DB_PASSWORD: ${BC_DB_PASSWORD:-bc}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../k8s/config/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro,z
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bc"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  temporal-schema:
    # one-shot: create temporal + temporal_visibility and apply every schema version
    image: temporalio/admin-tools:1.32.2
    entrypoint: ["/bin/sh", "/scripts/temporal-setup.sh"]
    command: ["schema"]
    environment: *temporal-db
    volumes:
      - ../k8s/config/temporal-setup.sh:/scripts/temporal-setup.sh:ro,z
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  temporal:
    image: temporalio/server:1.32.2
    environment:
      <<: *temporal-db
      BIND_ON_IP: 0.0.0.0
      LOG_LEVEL: warn
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/temporal.yaml
    volumes:
      - ../k8s/config/temporal-dynamicconfig.yaml:/etc/temporal/dynamicconfig/temporal.yaml:ro,z
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    restart: unless-stopped

  temporal-namespace:
    # one-shot: wait for the server, create the `default` namespace (30-day retention) if missing
    image: temporalio/admin-tools:1.32.2
    entrypoint: ["/bin/sh", "/scripts/temporal-setup.sh"]
    command: ["namespace"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
    volumes:
      - ../k8s/config/temporal-setup.sh:/scripts/temporal-setup.sh:ro,z
    depends_on:
      - temporal
    restart: on-failure

  temporal-ui:
    image: temporalio/ui:2.56.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "127.0.0.1:8233:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: bayesian-credit-api:local
    environment:
      <<: *app-env
      GUNICORN_WORKERS: "2"
    volumes:
      - ../../data:/app/data          # Lending Club file, parquet caches, fit artifacts, simulation run dirs
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      temporal-namespace: { condition: service_completed_successfully }
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    restart: unless-stopped

  worker:
    # Runs every background job: `manage.py temporal_worker` supervises one `run_job` process per job.
    image: bayesian-credit-api:local
    command: ["worker"]
    environment:
      <<: *app-env
      TEMPORAL_WORKER_CONCURRENCY: "2"
    volumes:
      - ../../data:/app/data          # shared with the API: artifacts and run directories
    depends_on:
      api: { condition: service_healthy }       # the API container applies the migrations
    healthcheck:
      disable: true
    stop_grace_period: 60s                    # a running simulation checkpoints on SIGTERM
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6g
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    image: bayesian-credit-web:local
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
