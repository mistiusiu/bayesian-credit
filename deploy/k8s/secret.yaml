# Replace the values before applying, e.g.
#   kubectl -n bayesian-credit create secret generic api-secrets \
#     --from-literal=DJANGO_SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=DATABASE_URL=postgres://bc:<BC_DB_PASSWORD>@postgres:5432/bc --dry-run=client -o yaml
# BC_DB_PASSWORD / TEMPORAL_DB_PASSWORD are applied by postgres-init.sh on the volume's first boot only.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: change-me-before-deploying
  DATABASE_URL: postgres://bc:change-me-bc@postgres:5432/bc
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me-postgres
  BC_DB_PASSWORD: change-me-bc
  TEMPORAL_DB_PASSWORD: change-me-temporal
