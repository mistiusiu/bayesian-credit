# Replace before applying:  kubectl -n bayesian-credit create secret generic api-secrets --from-literal=DJANGO_SECRET_KEY=$(openssl rand -hex 32) --dry-run=client -o yaml > deploy/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: change-me-before-deploying
  # DATABASE_URL: postgres://bc:bc@postgres.bayesian-credit.svc:5432/bc
