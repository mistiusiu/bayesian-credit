# Temporal server 1.32 on PostgreSQL (persistence: temporal, visibility: temporal_visibility).
# The initContainer creates the databases and applies every schema version (idempotent, also on
# upgrades); the temporal-namespace Job registers the `default` namespace; temporal-ui serves the
# web UI. To use a managed Temporal (helm chart temporalio/temporal, Temporal Cloud) instead,
# point TEMPORAL_ADDRESS (configmap) at it and drop this file from the kustomization.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels: { app: temporal, app.kubernetes.io/part-of: bayesian-credit }
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal }
  template:
    metadata:
      labels: { app: temporal }
    spec:
      initContainers:
        - name: schema
          image: temporalio/admin-tools:1.32.2
          command: ["/bin/sh", "/config/temporal-setup.sh", "schema"]
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: POSTGRES_USER, value: temporal }
            - name: POSTGRES_PWD
              valueFrom: { secretKeyRef: { name: postgres-secrets, key: TEMPORAL_DB_PASSWORD } }
            - { name: DBNAME, value: temporal }
            - { name: VISIBILITY_DBNAME, value: temporal_visibility }
          volumeMounts:
            - { name: config, mountPath: /config }
      containers:
        - name: temporal
          image: temporalio/server:1.32.2
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: POSTGRES_USER, value: temporal }
            - name: POSTGRES_PWD
              valueFrom: { secretKeyRef: { name: postgres-secrets, key: TEMPORAL_DB_PASSWORD } }
            - { name: DBNAME, value: temporal }
            - { name: VISIBILITY_DBNAME, value: temporal_visibility }
            - { name: BIND_ON_IP, value: 0.0.0.0 }
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: LOG_LEVEL, value: warn }
            - { name: DYNAMIC_CONFIG_FILE_PATH, value: /config/temporal-dynamicconfig.yaml }
          ports:
            - { containerPort: 7233, name: grpc }
          volumeMounts:
            - { name: config, mountPath: /config }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config
          configMap: { name: bc-config-files, defaultMode: 0755 }
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels: { app: temporal }
spec:
  selector: { app: temporal }
  ports:
    - { name: grpc, port: 7233, targetPort: grpc, appProtocol: grpc }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace
  labels: { app: temporal-namespace }
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600     # gone before the next `kubectl apply -k`, so the Job can be re-created
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: namespace
          image: temporalio/admin-tools:1.32.2
          command: ["/bin/sh", "/config/temporal-setup.sh", "namespace"]
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
            - { name: TEMPORAL_NAMESPACE, value: default }
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - name: config
          configMap: { name: bc-config-files, defaultMode: 0755 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  labels: { app: temporal-ui, app.kubernetes.io/part-of: bayesian-credit }
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal-ui }
  template:
    metadata:
      labels: { app: temporal-ui }
    spec:
      containers:
        - name: ui
          image: temporalio/ui:2.56.1
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
          ports: [{ containerPort: 8080, name: http }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  labels: { app: temporal-ui }
spec:
  selector: { app: temporal-ui }
  ports:
    - { name: http, port: 8080, targetPort: http }
