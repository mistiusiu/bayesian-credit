apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOW_ALL_ORIGINS: "1"
  DATA_ROOT: /app/data
  ARTIFACT_ROOT: /app/data/artifacts
  LENDING_CLUB_PATH: /app/data/raw/accepted_2007_to_2018Q4.csv.gz
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"
  # Background jobs are Temporal workflows (temporal.yaml) executed by the worker Deployment.
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: bayesian-credit-jobs
  TEMPORAL_UI_URL: http://temporal.bayesian-credit.local
  TEMPORAL_WORKER_CONCURRENCY: "2"
  TEMPORAL_GC_SCHEDULE: "0 3 * * *"
