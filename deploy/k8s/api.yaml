apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api, app.kubernetes.io/part-of: bayesian-credit }
spec:
  replicas: 1            # SQLite + RWO volume => single replica; scale after moving to Postgres
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/v1/metrics/
        prometheus.io/port: "8000"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: api
          image: bayesian-credit-api
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: db, mountPath: /app/api/db }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }   # jobs run in the worker pods; this serves requests + shadow evaluate
          readinessProbe:
            httpGet: { path: /api/v1/health/, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health/, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: bc-data }
        - name: db
          persistentVolumeClaim: { claimName: bc-db }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8000, targetPort: http }
