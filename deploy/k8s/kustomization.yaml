apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bayesian-credit
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
images:
  - name: bayesian-credit-api
    newName: ghcr.io/mistiusiu/bayesian-credit-api
    newTag: latest
  - name: bayesian-credit-web
    newName: ghcr.io/mistiusiu/bayesian-credit-web
    newTag: latest
